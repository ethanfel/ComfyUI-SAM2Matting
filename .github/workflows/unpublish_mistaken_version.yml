name: Unpublish mistaken Registry version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact mistaken version to remove
        required: true
        type: string

permissions:
  contents: read

jobs:
  unpublish-version:
    runs-on: ubuntu-latest
    steps:
      - name: Remove mistaken Registry version
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "1.5.0"
          curl --fail-with-body --request DELETE \
            --url "https://api.comfy.org/publishers/ethanfel/nodes/sam2matting-video/versions/${VERSION}" \
            --header "Authorization: Bearer ${REGISTRY_ACCESS_TOKEN}"
